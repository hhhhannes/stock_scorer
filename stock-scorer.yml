name: Stock Scorer

on:
  # Manuell ausloesen ueber den "Run workflow"-Button im Actions-Tab
  workflow_dispatch:
  # Automatisch nach Zeitplan (Cron, in UTC!)
  # Beispiel: Mo-Fr um 07:00 UTC = 08:00/09:00 MEZ/MESZ
  schedule:
    - cron: "0 7 * * 1-5"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Script ausfuehren
        run: |
          python stock_scorer.py AAPL MSFT NVDA GOOGL AMZN META TSLA | tee report.txt

      - name: Report als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ github.run_number }}
          path: report.txt
          retention-days: 30
